<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>HoloCard FX · 3D 全息头像生成器</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="theme-cosmic filter-normal">
  <div class="bg-glow"></div>
  <div class="bg-grid"></div>

  <!-- Header -->
  <header class="app-header">
    <div class="logo">
      <span class="logo-badge">3D FX</span>
      <span class="logo-text">HoloCard<strong>Studio</strong></span>
    </div>
    <div class="header-actions">
      <button id="btnSoundToggle" class="btn btn-secondary" title="切换音效">🔊 音效: 开</button>
      <button id="btnAutoSpin" class="btn btn-secondary">🎥 360° 巡航</button>
      <button id="btnExport" class="btn btn-primary">📸 导出高清卡片</button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="app-main">
    <!-- Left Sidebar: Controls -->
    <aside class="controls-panel">
      <div class="panel-header">
        <h2>✨ 全息头像工坊</h2>
        <p>上传头像或照片，生成带有流光溢彩与 3D 悬浮质感的专属全息卡</p>
      </div>

      <!-- Theme / Foil Texture -->
      <section class="control-section">
        <label class="section-label">✨ 全息材质风格</label>
        <div class="style-selector">
          <button class="style-btn active" data-style="cosmic">
            <span class="style-dot cosmic"></span>极光星空
          </button>
          <button class="style-btn" data-style="gold">
            <span class="style-dot gold"></span>重工烫金
          </button>
          <button class="style-btn" data-style="cyber">
            <span class="style-dot cyber"></span>赛博霓虹
          </button>
          <button class="style-btn" data-style="diamond">
            <span class="style-dot diamond"></span>碎钻水晶
          </button>
        </div>
      </section>

      <!-- Avatar & Image Upload & Fusion Filters -->
      <section class="control-section">
        <label class="section-label">🖼️ 头像上传与滤镜</label>
        <div class="upload-box" id="uploadDropzone">
          <input type="file" id="imageInput" accept="image/*" class="file-input">
          <div class="upload-content">
            <span class="upload-icon">📂</span>
            <span class="upload-text">点击或拖拽上传你的照片 / 头像</span>
            <span class="upload-hint">支持自拍、宠物、AI 插画等任意图片</span>
          </div>
        </div>

        <!-- Blend Filter Modes -->
        <div class="filter-selector-group">
          <span class="sub-label">🎨 头像滤镜风格：</span>
          <div class="filter-buttons">
            <button class="filter-btn active" data-filter="normal">原图</button>
            <button class="filter-btn" data-filter="cyber">👾 赛博双色</button>
            <button class="filter-btn" data-filter="gold">🪙 烫金浮雕</button>
            <button class="filter-btn" data-filter="holo">🔮 全息幽灵</button>
            <button class="filter-btn" data-filter="dither">🕹️ 复古点阵</button>
          </div>
        </div>

        <!-- Preset Avatars -->
        <div class="preset-avatars">
          <span>预设头像：</span>
          <button class="preset-btn" data-preset="agent">🤖 赛博 Agent</button>
          <button class="preset-btn" data-preset="cat">🐱 量子猫</button>
          <button class="preset-btn" data-preset="dragon">🐉 霓虹龙</button>
        </div>
      </section>

      <!-- Clean Text Inputs (Optional) -->
      <section class="control-section">
        <label class="section-label">📝 底部署名 (可选)</label>
        <div class="form-group">
          <input type="text" id="inputName" value="郭远凯 · Kai" maxlength="20" placeholder="填写姓名或留空">
        </div>
      </section>
    </aside>

    <!-- Right: 3D Stage -->
    <section class="stage-container">
      <div class="stage-hint" id="stageHint">
        <span>✨ 晃动鼠标体验 3D 悬浮与镭射全息流光</span>
      </div>

      <!-- 3D Card Scene -->
      <div class="card-scene" id="cardScene">
        
        <!-- Interactive Particle Canvas Overlay -->
        <canvas id="particleCanvas" class="particle-canvas"></canvas>

        <!-- Pure Clean 3D Framed Holographic Card -->
        <div class="holo-card" id="holoCard">
          
          <!-- Holographic Shimmer Overlays -->
          <div class="layer-foil"></div>
          <div class="layer-glare"></div>
          <div class="layer-sparkles"></div>

          <!-- Pure Clean Framed Avatar -->
          <div class="card-frame-content">
            <div class="card-avatar-box">
              <div class="art-img-wrapper" id="artWrapper">
                <img id="cardImage" src="" alt="Avatar Photo" crossorigin="anonymous">
              </div>
            </div>
            
            <!-- Minimal Bottom Name Bar -->
            <div class="card-clean-caption">
              <span id="displayName">郭远凯 · Kai</span>
            </div>
          </div>

        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
