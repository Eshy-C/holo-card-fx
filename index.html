<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Polaroid 3D · 3D 全息拍立得工坊</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="theme-rainbow">
  <div class="bg-glow"></div>
  <div class="bg-grid"></div>

  <!-- Header -->
  <header class="app-header">
    <div class="logo">
      <span class="logo-badge">POLAROID</span>
      <span class="logo-text">Holo<strong>Polaroid</strong></span>
    </div>
    <div class="header-actions">
      <button id="btnAutoSpin" class="btn btn-secondary">🎥 360° 悬浮展示</button>
      <button id="btnExport" class="btn btn-primary">📸 导出高清拍立得</button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="app-main">
    <!-- Controls Panel -->
    <aside class="controls-panel">
      <div class="panel-header">
        <h2>📷 拍立得定制工坊</h2>
        <p>经典复古白边相纸，融合 3D 物理悬浮与全息极光镀膜</p>
      </div>

      <!-- Theme / Shimmer Tone -->
      <section class="control-section">
        <label class="section-label">✨ 胶片光影镀膜</label>
        <div class="style-selector">
          <button class="style-btn active" data-style="rainbow">
            <span class="style-dot rainbow"></span>彩虹极光
          </button>
          <button class="style-btn" data-style="sunset">
            <span class="style-dot sunset"></span>落日霞光
          </button>
          <button class="style-btn" data-style="cyber">
            <span class="style-dot cyber"></span>赛博霓虹
          </button>
          <button class="style-btn" data-style="pure">
            <span class="style-dot pure"></span>经典纯净
          </button>
        </div>
      </section>

      <!-- Avatar & Image Upload -->
      <section class="control-section">
        <label class="section-label">🖼️ 照片上传</label>
        <div class="upload-box" id="uploadDropzone">
          <input type="file" id="imageInput" accept="image/*" class="file-input">
          <div class="upload-content">
            <span class="upload-icon">📂</span>
            <span class="upload-text">点击或拖拽上传照片</span>
            <span class="upload-hint">支持自拍、生活照、风景或任意头像</span>
          </div>
        </div>

        <!-- Presets -->
        <div class="preset-avatars">
          <span>预设示例：</span>
          <button class="preset-btn" data-preset="portrait">👤 人像摄影</button>
          <button class="preset-btn" data-preset="cat">🐱 橘猫拍立得</button>
          <button class="preset-btn" data-preset="scenery">🌅 富士山夕阳</button>
        </div>
      </section>

      <!-- Polaroid Handwritten Caption & Date -->
      <section class="control-section">
        <label class="section-label">✍️ 拍立得手写小字</label>
        <div class="form-group">
          <label>手写寄语 / 标题</label>
          <input type="text" id="inputCaption" value="Summer Vibes · 2026" maxlength="30">
        </div>
        <div class="form-group">
          <label>拍摄日期 / 地点</label>
          <input type="text" id="inputDate" value="2026.09.05 / Tokyo" maxlength="24">
        </div>
      </section>
    </aside>

    <!-- 3D Stage -->
    <section class="stage-container">
      <div class="stage-hint">
        <span>✨ 晃动鼠标体验 3D 悬浮拍立得与胶片反光</span>
      </div>

      <!-- 3D Scene -->
      <div class="card-scene" id="cardScene">
        <!-- True Polaroid Frame Card -->
        <div class="polaroid-card" id="polaroidCard">
          
          <div class="polaroid-body">
            
            <!-- Dark Glossy Photo Area (Square / Classic 1:1 Aspect) -->
            <div class="photo-pocket">
              <img id="polaroidImage" src="" alt="Polaroid Photo" crossorigin="anonymous">
              <!-- Internal Glare & Shimmer Layers (Strictly clipped to Photo Box) -->
              <div class="film-glare"></div>
              <div class="film-hologram"></div>
              <div class="photo-shadow"></div>
            </div>

            <!-- Bottom Classic White Chin for Handwritten Text -->
            <div class="polaroid-chin">
              <div class="handwritten-caption" id="displayCaption">Summer Vibes · 2026</div>
              <div class="handwritten-date" id="displayDate">2026.09.05 / Tokyo</div>
            </div>

          </div>

        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
